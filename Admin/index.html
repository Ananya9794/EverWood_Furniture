<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin - Dashboard | Furniture</title>
  <!-- Bootstrap & FontAwesome (CDN) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link href="css/custom.css" rel="stylesheet">
</head>
<body id="page-top">
  <!-- Page Wrapper -->
  <div id="wrapper">
    <!-- Sidebar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark flex-column p-3 vh-100" id="sidebar">
      <a class="navbar-brand mb-4" href="index.html">EverWood Admin</a>
      <ul class="nav nav-pills flex-column">
        <li class="nav-item"><a class="nav-link text-white" href="index.html"><i class="fa fa-dashboard me-2"></i> Dashboard</a></li>
        <li class="nav-item"><a class="nav-link text-white" href="products.html"><i class="fa fa-boxes me-2"></i> Products</a></li>
        <li class="nav-item"><a class="nav-link text-white" href="add-product.html"><i class="fa fa-plus me-2"></i> Add Product</a></li>
        <li class="nav-item"><a class="nav-link text-white" href="orders.html"><i class="fa fa-shopping-cart me-2"></i> Orders</a></li>
        <li class="nav-item"><a class="nav-link text-white" href="customers.html"><i class="fa fa-users me-2"></i> Customers</a></li>
      </ul>
    </nav>
    <!-- End Sidebar -->

    <!-- Content Wrapper -->
    <div id="content-wrapper" class="d-flex flex-column w-100">
      <div id="content">
        <!-- Topbar -->
        <nav class="navbar navbar-light bg-light">
          <div class="container-fluid">
            <button class="btn btn-outline-secondary" id="sidebarToggle">☰</button>
            <form class="d-flex ms-auto">
              <input class="form-control me-2" type="search" placeholder="Search...">
              <button class="btn btn-primary" type="submit">Search</button>
            </form>
          </div>
        </nav>
        <!-- End Topbar -->

        <!-- Main Content -->
        <div class="container-fluid p-4">
          <h1 class="h3 mb-4">Dashboard</h1>

          <div class="row">
            <div class="col-md-3 mb-3">
              <div class="card shadow-sm">
                <div class="card-body">
                  <h6>Total Products</h6>
                  <h3 id="stat-products">2</h3>
                </div>
              </div>
            </div>
            <div class="col-md-3 mb-3">
              <div class="card shadow-sm">
                <div class="card-body">
                  <h6>Total Orders</h6>
                  <h3 id="stat-orders">2</h3>
                </div>
              </div>
            </div>
            <div class="col-md-3 mb-3">
              <div class="card shadow-sm">
                <div class="card-body">
                  <h6>Total Customers</h6>
                  <h3 id="stat-customers">2</h3>
                </div>
              </div>
            </div>
            <div class="col-md-3 mb-3">
              <div class="card shadow-sm">
                <div class="card-body">
                  <h6>Revenue</h6>
                  <h3 id="stat-revenue">₹10000</h3>
                </div>
              </div>
            </div>
          </div>

          <div class="row mt-4">
            <div class="col-lg-8">
              <div class="card shadow-sm mb-4">
                <div class="card-header">Sales Overview</div>
                <div class="card-body">
                  <canvas id="salesChart" height="120"></canvas>
                </div>
              </div>
            </div>
            <div class="col-lg-4">
              <div class="card shadow-sm mb-4">
                <div class="card-header">Recent Orders</div>
                <div class="card-body" id="recent-orders">
                  12<!-- populated by JS -->
                </div>
              </div>
            </div>
          </div>

        </div>
        <!-- End Main Content -->
      </div>

      <!-- Footer -->
      <footer class="bg-light text-center py-3">
        <div class="container">&copy; EverWood Ananya 2025</div>
      </footer>
      <!-- End Footer -->
    </div>
    <!-- End Content Wrapper -->
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="js/admin-scripts.js"></script>
</body>
</html>
