<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add Product | Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/custom.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2>Add Product</h2>
      <a href="products.html" class="btn btn-secondary">Back to Products</a>
    </div>

    <div class="card">
      <div class="card-body">
        <form id="addProductForm">
          <div class="mb-3">
            <label class="form-label">Product Name</label>
            <input type="text" id="pName" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Price (INR)</label>
            <input type="number" id="pPrice" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Category</label>
            <input type="text" id="pCategory" class="form-control">
          </div>
          <div class="mb-3">
            <label class="form-label">Image URL</label>
            <input type="text" id="pImage" class="form-control" placeholder="img/dummy-product.jpg or https://...">
          </div>
          <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea id="pDesc" class="form-control" rows="4"></textarea>
          </div>
          <button class="btn btn-primary" type="submit">Add Product</button>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/admin-scripts.js"></script>
</body>
</html>
